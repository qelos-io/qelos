name: Docker Release
# the commit being released is part of the run's title: the deploy workflow reads it from there
run-name: Docker Release ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Qelos CI/CD"]
    types:
      - completed

# Add permissions needed for GitHub Container Registry
permissions:
  contents: read
  packages: write

jobs:
  setup:
    runs-on: ubuntu-latest
    # Release only what was pushed to this repository's main branch. This workflow runs with write access to the
    # registry, so it must never build or publish anything that comes out of a pull request run.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository }}
    outputs:
      services: '["admin", "auth", "assets", "content", "drafts", "gateway", "payments", "plugins", "secrets", "no-code", "ai", "mcp"]'
    steps:
      - name: Set up services list
        run: echo "Services list prepared"

  docker-release:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.setup.outputs.services) }}
    steps:
      # A workflow_run workflow runs on the newest commit of the default branch, which may already be ahead of the
      # commit whose build artifacts are released here. Everything below has to use the built commit.
      - name: Checkout the built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Short id of the built commit
        id: commit
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ./apps/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      
      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        if: ${{ github.event.workflow_run.head_branch == 'main' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/qelos/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=ref,event=branch
            type=raw,value=sha-${{ steps.commit.outputs.short }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/${{ matrix.service }}
          push: ${{ github.event.workflow_run.head_branch == 'main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # one cache scope per service: the 12 matrix jobs (and concurrent runs for the same commit) otherwise
          # share the default scope and can collide reserving the same cache key ("failed to reserve cache")
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
