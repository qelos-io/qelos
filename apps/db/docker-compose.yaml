services:
  qelos-db:
    image: mongo
    container_name: qelos-db
    ports:
      - "27017:27017"
      - "27018:27018"
      - "27019:27019"
    volumes:
      # a named volume, not a bind mount: Docker Desktop's file sharing on macOS can refuse
      # WiredTiger's file operations on a mounted folder ("Operation not permitted")
      - qelos-db-data:/data/db
    restart: always
volumes:
  qelos-db-data:
    name: qelos-db-data
networks:
  common_network:
